<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BridgeA{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ikon Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <header class="header-atas">
        <div class="header-konten">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="BridgeA Logo" class="logo-img">
            <p class="subjudul">Pembelajaran Bahasa Inggris Interaktif untuk Murid dengan Hambatan Pendengaran</p>
        </div>
    </header>

    <main class="konten-utama" style="position: relative; overflow: hidden; min-height: calc(100vh - 120px);">
        <!-- Bentuk dekoratif latar belakang sisi kiri -->
        <div class="bentuk bentuk-kiri-utama bentuk-anim-1"></div>
        <div class="bentuk bentuk-kiri-aksen bentuk-anim-2"></div>
        
        <!-- Bentuk dekoratif latar belakang sisi kanan -->
        <div class="bentuk bentuk-kanan-utama bentuk-anim-1"></div>
        <div class="bentuk bentuk-kanan-aksen bentuk-anim-2"></div>

        {% block content %}{% endblock %}
    </main>
    <script>
        function togglePassword(element) {
            var group = element.closest('.grup-input');
            var input = group.querySelector('input');
            var icon = element.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('ph-eye-slash');
                icon.classList.add('ph-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('ph-eye');
                icon.classList.add('ph-eye-slash');
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
