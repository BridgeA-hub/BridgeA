{% extends 'guru_base.html' %}

{% block konten_dashboard %}
<div style="margin-bottom: 2rem;">
    <h2 style="font-size: 1.4rem; font-weight: 700; color: var(--hitam-teks);">Riwayat Sesi Pembelajaran Kelas</h2>
</div>

<div style="display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-start;">
    
    <!-- Tambah Folder Baru -->
    <div style="flex: 0 0 auto; width: 300px; background-color: var(--putih); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);">
        <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--hitam-teks); margin-bottom: 1.2rem;">Tambah Folder Baru</h3>
        
        <form action="{{ url_for('guru_tambah_folder') }}" method="POST">
            <div style="display: flex; border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden; margin-bottom: 1.2rem;">
                <div style="background-color: #f1f5f9; padding: 0.7rem; border-right: 1px solid #cbd5e1; color: #475569; display: flex; align-items: center; justify-content: center; width: 45px;">
                    <i class="ph-fill ph-list-dashes" style="font-size: 1.1rem;"></i>
                </div>
                <input type="text" name="nama_folder" placeholder="Nama Kelas (Kelas XI - A)" style="flex: 1; padding: 0.7rem; border: none; outline: none; font-size: 0.9rem; color: #334155;" required>
            </div>

            <button type="submit" style="width: 100%; background-color: #2563eb; color: white; border: none; border-radius: 6px; padding: 0.8rem; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: background-color 0.2s;">
                <i class="ph ph-plus" style="font-size: 1.2rem; font-weight: bold;"></i> Tambah Folder Baru
            </button>
        </form>
    </div>

    <!-- Daftar Folder -->
    <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; flex: 1;">
        {% for folder in daftar_folder %}
        <div style="width: 180px; position: relative; background-color: var(--putih); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); transition: transform 0.2s;">
            <form action="{{ url_for('guru_hapus_folder', id_kelas=folder.id) }}" method="POST" style="position: absolute; top: 10px; right: 10px;" onsubmit="return confirm('Yakin ingin menghapus folder kelas ini?');">
                <button type="submit" title="Hapus Folder" style="background: none; border: none; color: #ef4444; cursor: pointer; padding: 5px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#fee2e2';" onmouseout="this.style.backgroundColor='transparent';">
                    <i class="ph-fill ph-trash" style="font-size: 1.2rem;"></i>
                </button>
            </form>
            <i class="ph-fill ph-folder" style="font-size: 6rem; color: #0ea5e9; margin-bottom: 0.5rem; filter: drop-shadow(0 4px 3px rgba(14, 165, 233, 0.3));"></i>
            <h4 style="font-size: 1.05rem; font-weight: 700; color: var(--hitam-teks); margin-bottom: 1rem; text-align: center;">{{ folder.nama_kelas }}</h4>
            <a href="{{ url_for('guru_riwayat_kelas', nama_kelas=folder.nama_kelas) }}" style="width: 100%; text-align: center; background-color: #dbeafe; color: #2563eb; padding: 0.5rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; text-decoration: none; transition: background-color 0.2s;">
                Lihat Riwayat
            </a>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
