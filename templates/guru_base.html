{% extends 'dashboard_base.html' %}

{% block sidebar_profil %}
    <div style="font-weight: 700; margin-bottom: 0.5rem; text-align: center; color: var(--hitam-teks);">Guru</div>
    <div class="profil-img" style="background-color: transparent; border-radius: 0;">
        <img src="https://ui-avatars.com/api/?name=Guru&background=random" alt="Profil" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
        <div class="status-dot"></div>
    </div>
    <div class="profil-nama">Nama Guru Pengajar 1</div>
    <div class="profil-nip">NIP...</div>
{% endblock %}

{% block sidebar_nav %}
    <a href="{{ url_for('dashboard_guru') }}" class="nav-item {% if request.endpoint == 'dashboard_guru' %}aktif{% endif %}">
        <i class="ph ph-house"></i> <span>Beranda</span>
    </a>
    <a href="{{ url_for('guru_modul') }}" class="nav-item {% if request.endpoint == 'guru_modul' %}aktif{% endif %}">
        <i class="ph ph-presentation-chart"></i> <span>Modul Pembelajaran</span>
    </a>
    <a href="{{ url_for('guru_riwayat') }}" class="nav-item {% if request.endpoint == 'guru_riwayat' %}aktif{% endif %}">
        <i class="ph ph-clock-counter-clockwise"></i> <span>Riwayat Sesi</span>
    </a>
{% endblock %}
