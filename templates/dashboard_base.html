<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BridgeA - Dashboard{% endblock %}</title>
    <!-- Include main style variables -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ikon Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        // Verifikasi sesi tab tunggal sebelum merender halaman
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const path = window.location.pathname;
            
            let loginUrl = '/';
            if (path.startsWith('/admin')) {
                loginUrl = '/login/admin';
            } else if (path.startsWith('/guru')) {
                loginUrl = '/login/guru';
            } else if (path.startsWith('/kepsek')) {
                loginUrl = '/login/kepala-sekolah';
            }
            
            if (urlParams.get('login') === 'success') {
                sessionStorage.setItem('tab_session_active', 'true');
                const cleanUrl = window.location.origin + path;
                window.history.replaceState({}, document.title, cleanUrl);
            } else {
                if (sessionStorage.getItem('tab_session_active') !== 'true') {
                    window.location.href = loginUrl;
                }
            }
        })();
    </script>
</head>
<body class="dasbor-body">
    <!-- Header Atas -->
    <header class="header-dasbor">
        <!-- Bentuk dekoratif geometris -->
        <div class="bentuk bentuk-kiri-utama bentuk-anim-1"></div>
        <div class="bentuk bentuk-kiri-aksen bentuk-anim-2"></div>
        
        <div class="bentuk bentuk-kanan-utama bentuk-anim-1"></div>
        <div class="bentuk bentuk-kanan-aksen bentuk-anim-2"></div>

        <div class="header-konten" style="position: relative; z-index: 2;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="BridgeA Logo" class="logo-img">
            <p class="subjudul">Pembelajaran Bahasa Inggris Interaktif untuk Murid dengan Hambatan Pendengaran</p>
        </div>
    </header>

    <div class="wadah-utama">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Dashboard</span>
                <i class="ph ph-list" id="toggleSidebar" style="cursor: pointer;"></i>
            </div>
            
            <div class="sidebar-profil">
                {% block sidebar_profil %}{% endblock %}
            </div>
            
            <nav class="navigasi">
                {% block sidebar_nav %}{% endblock %}
            </nav>

            <div class="sidebar-footer">
                <a href="{{ url_for('logout') }}" class="tombol-keluar" onclick="sessionStorage.clear();">
                    <i class="ph ph-arrow-left"></i> <span>Keluar</span>
                </a>
            </div>
        </aside>

        <!-- Konten Utama -->
        <main class="konten-dasbor">
            {% block konten_dashboard %}{% endblock %}
        </main>
    </div>

    <!-- Script tambahan untuk modal/interaksi (jika ada) -->
    <script>
        document.getElementById('toggleSidebar').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('mini');
        });

        function unggahFotoProfil(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                if (!file.type.startsWith('image/')) {
                    alert('File yang dipilih harus berupa gambar.');
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    alert('Ukuran file maksimal 5MB.');
                    return;
                }

                const formData = new FormData();
                formData.append('foto_profil', file);

                const overlay = document.querySelector('.overlay-foto');
                if (overlay) {
                    overlay.innerHTML = '<i class="ph ph-spinner ph-spin" style="font-size: 1.5rem; color: white;"></i>';
                    overlay.style.opacity = '1';
                }

                fetch('/api/upload_foto_profil', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const img = document.getElementById('gambar-profil-sidebar');
                        if (img) {
                            img.src = '/static/uploads/profil/' + data.filename + '?t=' + Date.now();
                        } else {
                            const wadah = document.querySelector('.profil-img');
                            if (wadah) {
                                const inisial = document.getElementById('inisial-profil-sidebar');
                                if (inisial) inisial.remove();
                                
                                const newImg = document.createElement('img');
                                newImg.id = 'gambar-profil-sidebar';
                                newImg.src = '/static/uploads/profil/' + data.filename + '?t=' + Date.now();
                                newImg.alt = 'Profil';
                                newImg.style.width = '80px';
                                newImg.style.height = '80px';
                                newImg.style.borderRadius = '50%';
                                newImg.style.objectFit = 'cover';
                                
                                wadah.insertBefore(newImg, wadah.firstChild);
                            }
                        }
                        alert('Foto profil berhasil diperbarui!');
                    } else {
                        alert('Gagal mengunggah foto profil: ' + (data.error || 'Terjadi kesalahan.'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Terjadi kesalahan koneksi saat mengunggah foto profil.');
                })
                .finally(() => {
                    if (overlay) {
                        overlay.innerHTML = '<i class="ph ph-camera" style="font-size: 1.5rem; color: white;"></i>';
                        overlay.style.opacity = '';
                    }
                });
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
