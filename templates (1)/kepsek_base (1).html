{% extends 'dashboard_base.html' %}

{% block sidebar_profil %}
    <div style="font-weight: 700; margin-bottom: 0.5rem; text-align: center; color: var(--hitam-teks);">Kepala Sekolah</div>
    <div class="profil-img" style="background-color: transparent; border-radius: 0;">
        <img src="https://ui-avatars.com/api/?name=Kepala+Sekolah&background=random" alt="Profil" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
        <div class="status-dot"></div>
    </div>
    <div class="profil-nama">Nama Kepala Sekolah</div>
    <div class="profil-nip">NIP...</div>
{% endblock %}

{% block sidebar_nav %}
    <a href="{{ url_for('dashboard_kepsek') }}" class="nav-item {% if request.endpoint == 'dashboard_kepsek' %}aktif{% endif %}">
        <i class="ph ph-house"></i> <span>Beranda</span>
    </a>
    <a href="{{ url_for('kepsek_guru') }}" class="nav-item {% if request.endpoint == 'kepsek_guru' %}aktif{% endif %}">
        <i class="ph ph-users"></i> <span>Lihat Daftar Guru</span>
    </a>
    <a href="{{ url_for('kepsek_kelas') }}" class="nav-item {% if request.endpoint == 'kepsek_kelas' %}aktif{% endif %}">
        <i class="ph ph-chalkboard-teacher"></i> <span>Lihat Daftar Kelas</span>
    </a>
    <a href="{{ url_for('kepsek_riwayat') }}" class="nav-item {% if request.endpoint == 'kepsek_riwayat' %}aktif{% endif %}">
        <i class="ph ph-clock-counter-clockwise"></i> <span>Riwayat Sesi (View Only)</span>
    </a>
{% endblock %}
